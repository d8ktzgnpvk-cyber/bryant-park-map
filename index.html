<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bryant Park Holiday Shops – Live Map</title>
<style>
:root{--bg:#3d5a24;--ink:#fff;--panel:rgba(20,32,14,.88);--accent:#1a73e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#stage img{display:block;width:1051px;height:925px;pointer-events:none}
#dot{position:absolute;left:0;top:0;pointer-events:none;display:none}
#acc{position:absolute;border-radius:50%;background:rgba(26,115,232,.18);border:1.5px solid rgba(26,115,232,.55);transform:translate(-50%,-50%)}
#me{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%)}
#me .c{position:absolute;inset:0;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
#me .h{position:absolute;left:50%;top:50%;width:0;height:0;display:none;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:22px solid rgba(26,115,232,.75);transform-origin:50% 100%;margin-left:-9px;margin-top:-30px}
#me .p{position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--accent);animation:p 2s infinite}
@keyframes p{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#msg{flex:1 1 100%;font-size:13px;opacity:.9;min-height:18px}
button{flex:1 1 0;min-height:44px;border:0;border-radius:10px;background:#fff;color:#1d2b14;font:600 14px -apple-system,system-ui,sans-serif;padding:0 8px}
button.on{background:var(--accent);color:#fff}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,32,14,.75);z-index:5;padding:24px}
#start div{background:#fff;color:#1d2b14;border-radius:16px;padding:22px;max-width:340px;text-align:center}
#start h1{font-size:20px;margin:0 0 8px}
#start p{margin:0 0 16px;font-size:14px}
#start button{width:100%;background:var(--accent);color:#fff}
#fixhint{position:fixed;top:calc(12px + env(safe-area-inset-top));left:12px;right:12px;background:#ffcc00;color:#222;border-radius:10px;padding:10px 12px;font-weight:600;text-align:center;display:none;z-index:4}
</style>
</head>

nXef3DYXz1wx1fKIOTF0VgiCNaEA5sQzvd9W7jV88DsPb5nx45elFD6s5+cxTfhNNGkHfjtVf9yy81nkeDR9z1yfuGnGVHudsmtwd62RZEmyxeXNNhz3bZfUV9gXPLDbPcAi4Yrmx1Cc3OA0fl8EnOg7MIeNa4IRzHMMyrTP4hiICqpJdOg3uiRNmGarxr9VFa6ouUE90Hpfc0X+7DmI67LCD1X8uxYD0ZADOZ3X3GvKey6VN5oZ8RVI6WAbHoDOD1plVRo/xKhdir/wEYKixGPNqmj8idHl97pf/wJ5s03/BXlZdAAAAABJRU5ErkJggg==" alt="Bryant Park Holiday Shops map"><div id="dot"><div id="acc"></div><div id="me"><div class="h"></div><div class="p"></div><div class="c"></div></div></div></div></div>
<div id="fixhint">Tap the map where you actually are</div>
<div id="bar">
  <div id="msg">Waiting for GPS…</div>
  <button id="bCenter" class="on">Follow me</button>
  <button id="bCompass">Compass</button>
  <button id="bFix">Fix position</button>
  <button id="bReset">Reset fix</button>
</div>
<div id="start"><div><h1>Holiday Shops live map</h1><p>Shows your GPS position on the Bryant Park market map. Tall buildings nearby can throw GPS off by 10–30 m; use <b>Fix position</b> to nudge it.</p><button id="go">Start GPS</button></div></div>
<script>
{
/* ---- Geo-reference (Manhattan grid) ----
   Anchor: centre of W 42nd St & 6th Ave intersection.
   Map "up" = grid north (bearing ~28.9°). Park edges in image px:
   6th Ave property line x=117, 42nd St property line y=198, scale ~4.72 px per metre. */
const LAT0=40.754841, LON0=-73.984119, TH=28.9*Math.PI/180, S=4.72;
const PX0=117, PY0=198, HALF42=15.2, HALF6=15.2;
const MLAT=111132, MLON=111320*Math.cos(LAT0*Math.PI/180);
const IW=1051, IH=925;
function geoToPx(lat,lon){
  const dE=(lon-LON0)*MLON, dN=(lat-LAT0)*MLAT;
  const e=dE*Math.cos(TH)-dN*Math.sin(TH);   // metres east along streets
  const n=dE*Math.sin(TH)+dN*Math.cos(TH);   // metres north along avenues
  return {x:PX0+(e-HALF6)*S, y:PY0+(-n-HALF42)*S};
}

const view=document.getElementById('view'), stage=document.getElementById('stage');
const dot=document.getElementById('dot'), acc=document.getElementById('acc'), meEl=document.getElementById('me');
const head=meEl.querySelector('.h'), msg=document.getElementById('msg');
const bCenter=document.getElementById('bCenter'), bCompass=document.getElementById('bCompass');
const bFix=document.getElementById('bFix'), bReset=document.getElementById('bReset'), hint=document.getElementById('fixhint');

let sc=1, tx=0, ty=0, follow=true, fixing=false, pos=null, raw=null, heading=null, compassOn=false;
let off={x:0,y:0};
try{const o=JSON.parse(localStorage.getItem('bpOff')||'null'); if(o) off=o;}catch(e){}

function apply(){stage.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`; drawDot();}
function fit(){
  const vw=view.clientWidth, vh=view.clientHeight-110;
  sc=Math.min(vw/IW, vh/IH); tx=(vw-IW*sc)/2; ty=(vh-IH*sc)/2+4; apply();
}
function clamp(){
  sc=Math.max(0.25,Math.min(sc,6));
}
function centerOn(x,y){
  if(sc<1.1) sc=1.4;
  tx=view.clientWidth/2-x*sc; ty=(view.clientHeight-110)/2-y*sc; apply();
}
function drawDot(){
  if(!pos){dot.style.display='none';return;}
  dot.style.display='block';
  const x=pos.x+off.x, y=pos.y+off.y;
  meEl.style.left=x+'px'; meEl.style.top=y+'px';
  meEl.style.transform=`translate(-50%,-50%) scale(${1/sc})`;
  const r=Math.max(pos.acc*S,6);
  acc.style.left=x+'px'; acc.style.top=y+'px'; acc.style.width=acc.style.height=2*r+'px';
  if(heading!=null){head.style.display='block'; head.style.transform=`rotate(${heading-28.9}deg)`;} else head.style.display='none';
}

/* ---- pan / pinch / wheel ---- */
const pts=new Map(); let last=null, moved=false;
view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null;moved=false;});
view.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const a=[...pts.values()];
  const cx=a.reduce((s,p)=>s+p.x,0)/a.length, cy=a.reduce((s,p)=>s+p.y,0)/a.length;
  const d=a.length>1?Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y):0;
  if(last&&last.n===a.length){
    const dx=cx-last.cx, dy=cy-last.cy;
    if(Math.abs(dx)+Math.abs(dy)>3||a.length>1) moved=true;
    tx+=dx; ty+=dy;
    if(a.length>1&&last.d){const k=d/last.d, ns=Math.max(.25,Math.min(sc*k,6)), kk=ns/sc; tx=cx-(cx-tx)*kk; ty=cy-(cy-ty)*kk; sc=ns;}
    if(moved&&follow){follow=false;bCenter.classList.remove('on');}
    apply();
  }
  last={cx,cy,d,n:a.length};
});
function up(e){
  if(pts.size===1&&!moved&&fixing&&pos){
    const r=view.getBoundingClientRect();
    const mx=(e.clientX-r.left-tx)/sc, my=(e.clientY-r.top-ty)/sc;
    off={x:mx-pos.x,y:my-pos.y};
    try{localStorage.setItem('bpOff',JSON.stringify(off));}catch(_){}
    fixing=false; bFix.classList.remove('on'); hint.style.display='none'; drawDot(); status();
  }
  pts.delete(e.pointerId); last=null;
}
view.addEventListener('pointerup',up); view.addEventListener('pointercancel',up);
view.addEventListener('wheel',e=>{e.preventDefault();const k=Math.exp(-e.deltaY*0.002),ns=Math.max(.25,Math.min(sc*k,6)),kk=ns/sc;tx=e.clientX-(e.clientX-tx)*kk;ty=e.clientY-(e.clientY-ty)*kk;sc=ns;apply();},{passive:false});
window.addEventListener('resize',()=>{follow&&pos?centerOn(pos.x+off.x,pos.y+off.y):fit();});

/* ---- GPS ---- */
function status(){
  if(!pos){return;}
  const x=pos.x+off.x, y=pos.y+off.y;
  const out=x<0||y<0||x>IW||y>IH;
  const fixed=(off.x||off.y)?' · fix applied':'';
  msg.textContent=out?`You're outside the map area (±${Math.round(pos.acc)} m)${fixed}`:`GPS accuracy ±${Math.round(pos.acc)} m${fixed}`;
}
function onPos(p){
  const c=p.coords, q=geoToPx(c.latitude,c.longitude);
  pos={x:q.x,y:q.y,acc:c.accuracy};
  if(!compassOn&&c.heading!=null&&!isNaN(c.heading)&&c.speed>0.5) heading=c.heading;
  status(); drawDot();
  if(follow) centerOn(pos.x+off.x,pos.y+off.y);
}
async function onErr(e){
  let perm='n/a';
  try{if(navigator.permissions){perm=(await navigator.permissions.query({name:'geolocation'})).state;}}catch(_){}
  const ua=navigator.userAgent;
  const br=/CriOS/.test(ua)?'Chrome':/FxiOS/.test(ua)?'Firefox':/EdgiOS/.test(ua)?'Edge':/Safari/.test(ua)&&/Version\//.test(ua)?'Safari':'in-app browser';
  const sa=window.navigator.standalone?' (home-screen app)':'';
  msg.textContent=`${e.code===1?'Location denied':'GPS error'} · code ${e.code} · ${br}${sa} · secure:${window.isSecureContext} · permission:${perm} · ${e.message||''}`;
}
document.getElementById('go').onclick=()=>{
  document.getElementById('start').style.display='none';
  if(!navigator.geolocation){msg.textContent='This browser has no GPS access.';return;}
  navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
};

bCenter.onclick=()=>{follow=!follow;bCenter.classList.toggle('on',follow);if(follow&&pos)centerOn(pos.x+off.x,pos.y+off.y);else if(!pos)fit();};
bFix.onclick=()=>{if(!pos){msg.textContent='Need a GPS fix first.';return;}fixing=!fixing;bFix.classList.toggle('on',fixing);hint.style.display=fixing?'block':'none';follow=false;bCenter.classList.remove('on');};
bReset.onclick=()=>{off={x:0,y:0};try{localStorage.removeItem('bpOff');}catch(_){}drawDot();status();};
function onOri(e){
  let h=null;
  if(e.webkitCompassHeading!=null) h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null) h=360-e.alpha;
  if(h!=null){heading=h+(screen.orientation?screen.orientation.angle:0);drawDot();}
}
bCompass.onclick=async()=>{
  if(compassOn){compassOn=false;bCompass.classList.remove('on');window.removeEventListener('deviceorientation',onOri);window.removeEventListener('deviceorientationabsolute',onOri);heading=null;drawDot();return;}
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted'){msg.textContent='Compass permission denied.';return;}
    }
    window.addEventListener('deviceorientationabsolute',onOri); window.addEventListener('deviceorientation',onOri);
    compassOn=true; bCompass.classList.add('on');
  }catch(err){msg.textContent='Compass not available.';}
};

/* demo: ?demo puts you at the Lodge */
if(location.search.includes('demo')){document.getElementById('start').style.display='none';onPos({coords:{latitude:40.75395,longitude:-73.98305,accuracy:12,heading:null,speed:0}});}

const img=document.getElementById('map');
if(img.complete) fit(); else img.onload=fit;
}
</script>
